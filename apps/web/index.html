<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover : sur iPhone en plein écran, le contenu passe sous
         l'encoche ; les marges de sécurité se gèrent en CSS (env(safe-area-*)). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Titre et favicon : à renommer dès la création du projet. C'est ce qu'on
         oublie le plus longtemps, et ça se voit — onglet, favori, partage. -->
    <title>Vibe Stack</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- PWA : manifeste (nom, couleurs, icônes — à personnaliser avec le titre) et icône iOS,
         qui ignore le manifeste. Icônes PNG : scripts/make-icons.sh depuis public/icon.svg. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1f2937" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
